<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proctor Dashboard – Live Monitoring</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/violations-modal.css') }}">
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <div class="main-header animate-fade-in" style="text-align: center; margin: 40px 0 20px;">
    <h1><i class="fas fa-desktop"></i> Live Student Monitoring</h1>
  </div>

  <!-- ✅ THIS is where videos will appear -->
  <div id="studentGallery"></div>

  <!-- Violations Modal -->
  <div id="violationsModal" class="violations-modal">
    <div class="violations-modal-content">
      <div class="violations-modal-header">
        <h2><i class="fas fa-exclamation-triangle"></i> Violation Logs - <span id="modalPeerId"></span></h2>
        <button class="violations-close" onclick="closeViolationsModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="violationsContent">
        <!-- Violations will be loaded here -->
      </div>
    </div>
  </div>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- ✅ ONE JS FILE -->
  <script src="{{ url_for('static', filename='js/proctor-dashboard.js') }}"></script>
</body>
</html>
